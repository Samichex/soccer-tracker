<div class="topnav">
    <a class="brand" href="/">Full Time</a>
    <form class="topnav-search" action="/search" method="get">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" name="q" placeholder="Search teams or players..." value="{{ q or '' }}">
    </form>
    <div class="topnav-links">
        <a href="/" {% if request.url.path == '/' %}class="active" aria-current="page"{% endif %}>Matches</a>
        <a href="/teams" {% if request.url.path == '/teams' %}class="active" aria-current="page"{% endif %}>Teams</a>
        <a href="/players" {% if request.url.path == '/players' %}class="active" aria-current="page"{% endif %}>Players</a>
        <a href="/stats" {% if request.url.path == '/stats' %}class="active" aria-current="page"{% endif %}>Stats</a>
    </div>
</div>
{% set sync = last_synced() %}
<p class="sync-status" title="{{ sync.title }}">Synced {{ sync.label }}</p>
